name: Build Wheel

on:
  push:
    tags: ['wheel-*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build_wheel:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']
        torch-version: ['2.8.0']
        cuda-version: ['cu128']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          echo "Disk space after cleanup:"
          df -h
        shell: bash

      - name: Install CUDA ${{ matrix.cuda-version }}
        run: |
          bash .github/workflows/cuda/Linux.sh ${{ matrix.cuda-version }}
        shell: bash

      - name: Install PyTorch ${{ matrix.torch-version }}+${{ matrix.cuda-version }}
        run: |
          pip install torch==${{ matrix.torch-version }} --extra-index-url https://download.pytorch.org/whl/${{ matrix.cuda-version }}
          python -c "import torch; print('PyTorch:', torch.__version__)"
          python -c "import torch; print('CUDA:', torch.version.cuda)"
        shell: bash

      - name: Set version
        run: |
          VERSION=`sed -n 's/^__version__ = "\(.*\)"/\1/p' gsplat/version.py`
          TORCH_VERSION=`echo "pt${{ matrix.torch-version }}" | sed "s/..$//" | sed "s/\.//g"`
          CUDA_VERSION=`echo ${{ matrix.cuda-version }}`
          echo "New version name: $VERSION+$TORCH_VERSION$CUDA_VERSION"
          sed -i "s/$VERSION/$VERSION+$TORCH_VERSION$CUDA_VERSION/" gsplat/version.py
        shell: bash

      - name: Upgrade build deps
        run: |
          pip install --upgrade setuptools
          pip install ninja wheel
        shell: bash

      - name: Build wheel
        run: |
          source .github/workflows/cuda/Linux-env.sh ${{ matrix.cuda-version }}
          export TORCH_CUDA_ARCH_LIST="8.0;8.6;8.9;9.0;10.0;12.0+PTX"
          MAX_JOBS=2 python setup.py bdist_wheel --dist-dir=dist
        shell: bash

      - name: Test wheel
        run: |
          cd dist
          ls -lah
          pip install *.whl
          python -c "import gsplat; print('gsplat:', gsplat.__version__)"
          cd ..
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: compiled_wheel_python${{ matrix.python-version }}-${{ matrix.torch-version }}-${{ matrix.cuda-version }}
          path: dist/*.whl

      - name: Publish to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.whl \
            --title "${GITHUB_REF_NAME}" \
            --notes "gsplat ${{ matrix.cuda-version }} wheel for Python ${{ matrix.python-version }}, torch ${{ matrix.torch-version }}. Arch: 8.0;8.6;8.9;9.0;10.0;12.0+PTX."
        shell: bash
